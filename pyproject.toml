[project]
name = "pyment"
version = "4.1.3"
description = "Repository containing the pretrained model from the paper \"Learning diverse and generic representations of the brain with multi-task pretraining\" and illustrative scripts for using it"
authors = [
    {name = "Esten Leonardsen",email = "estenleonardsen@gmail.com"}
]
license = "CC-BY-NC"
license-files = [
    "LICENSE.md"
]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "tensorflow-macos>=2.11,<2.12; platform_system == 'Darwin'",
    "tensorflow-metal>=0.7,<0.8; platform_system == 'Darwin'",
    "tensorflow>=2.11,<2.12; platform_system != 'Darwin'",
    "numpy==1.23.5",
    "tomli==2.2.1",
    "pandas==1.4.2",
    "typing-extensions==4.12.2",
    "requests==2.32.3",
    "nibabel==5.2.1",
    "matplotlib==3.8",
    "tqdm==4.66.4",
    "scikit-learn==1.5.1",
    "xlrd==2.0.1",
    "pydantic==2.10",
]

[project.scripts]
pyment-predict = "pyment.cli.predict_from_fastsurfer_folder:main"
pyment-finetune = "pyment.cli.finetune_from_configuration:main"

[tool.poetry]
packages = [{include = "pyment"}]
include = [
    {path = "pyproject.toml", format = "sdist"}
]

[tool.ruff]
line-length = 80
target-version = "py310"
exclude = [".act", "checkpoints"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "G"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.13,<0.16.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

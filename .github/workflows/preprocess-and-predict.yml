name: Verify preprocess and predict Docker container

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprocess-and-predict:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download weights
        run: |
          pip install .
          python scripts/download_weights.py --identifiers multi-2025 reg-2025 --destination checkpoints/pyment

      - name: Install Docker CLI
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            else
              apt-get update
              apt-get install -y docker.io
            fi
          fi

      - name: Build preprocess-and-predict image
        run: |
          docker build \
            -f docker/preprocess_and_predict.Dockerfile \
            -t pyment-preprocess-and-predict:ci \
            .

      - name: Validate license secret
        env:
          FREESURFER_LICENSE: ${{ secrets.FREESURFER_LICENSE }}
        run: |
          if [ -z "$FREESURFER_LICENSE" ]; then
            echo "FREESURFER_LICENSE secret is required." >&2
            exit 1
          fi

      - name: GPU sanity check
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi
          else
            echo "nvidia-smi not found; no GPU visible in runner."
          fi

      - name: Install pandas
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip
          else
            apt-get update
            apt-get install -y python3 python3-pip
          fi
          python3 -m pip install --no-cache-dir pandas

      - name: Run container
        env:
          FREESURFER_LICENSE: ${{ secrets.FREESURFER_LICENSE }}
        run: |
          gpu_flags=""
          if command -v nvidia-smi >/dev/null 2>&1 || [ -e /dev/nvidiactl ]; then
            gpu_flags="--gpus all"
          fi
          CONTAINER=$(docker create \
            $gpu_flags \
            --env FREESURFER_LICENSE \
            pyment-preprocess-and-predict:ci \
            /bin/sh -c '
              mkdir -p /licenses /output/fastsurfer && \
              printf "%s" "$FREESURFER_LICENSE" > /licenses/freesurfer.txt && \
              /scripts/preprocess.sh \
                --license /licenses/freesurfer.txt \
                --python /envs/fastsurfer/bin/python \
                /input /output/fastsurfer && \
              pyment-predict \
                /output/fastsurfer \
                -d /output/predictions_multi.csv && \
              pyment-predict \
                /output/fastsurfer \
                -m sfcn-reg -w reg-2025 -t age \
                -d /output/predictions_reg.csv
            ')
          echo "CONTAINER=${CONTAINER}" >> "$GITHUB_ENV"
          docker cp "${{ github.workspace }}/.github/workflows/fixtures/ds000030/raw/." "${CONTAINER}:/input/"
          docker start -a "${CONTAINER}"
          mkdir -p "${{ github.workspace }}/.act/ds000030/outputs"
          docker cp "${CONTAINER}:/output/." "${{ github.workspace }}/.act/ds000030/outputs/"

      - name: Compare predictions
        run: |
          python3 - <<'PY'
          import os
          import sys
          import numpy as np
          import pandas as pd

          workspace = os.environ["GITHUB_WORKSPACE"]
          outputs = os.path.join(workspace, ".act/ds000030/outputs")

          gt = pd.read_csv(
            os.path.join(workspace, ".github/workflows/fixtures/ds000030/predictions.csv")
          )

          multi = pd.read_csv(os.path.join(outputs, "predictions_multi.csv"))
          multi["id"] = multi["source"].apply(lambda x: x.split("/")[-1])
          multi = multi.rename(columns={"age": "multi-2025"})[["id", "multi-2025"]]

          reg = pd.read_csv(os.path.join(outputs, "predictions_reg.csv"))
          reg["id"] = reg["source"].apply(lambda x: x.split("/")[-1])
          reg = reg.rename(columns={"age": "reg-2025"})[["id", "reg-2025"]]

          pred = pd.merge(multi, reg, on="id", how="inner")
          df = pd.merge(gt, pred, on="id", how="inner", suffixes=["_gt", "_pred"])

          if len(df) != len(gt):
            print(
              f"Expected {len(gt)} rows after join, got {len(df)}",
              file=sys.stderr
            )
            sys.exit(1)

          for col in ["multi-2025", "reg-2025"]:
            gt_col = f"{col}_gt"
            pred_col = f"{col}_pred"
            if not np.allclose(df[gt_col], df[pred_col], atol=1e-2):
              mean_difference = np.mean(np.abs(df[gt_col] - df[pred_col]))
              print(
                f"Column {col} differs between new predictions and ground "
                f"truths. Mean difference: {mean_difference}"
              )
              sys.exit(1)
          PY

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "${CONTAINER}" 2>/dev/null || true

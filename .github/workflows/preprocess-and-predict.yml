name: Verify preprocess and predict Docker container

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  preprocess-and-predict:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Download weights
        run: |
          pip install .
          python scripts/download_weights.py --identifiers multi-2025 --destination checkpoints/pyment
      - name: Install Docker CLI
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            else
              apt-get update
              apt-get install -y docker.io
            fi
          fi

      - name: Build preprocess-and-predict image
        run: |
          docker build \
            -f docker/preprocess_and_predict.Dockerfile \
            -t pyment-preprocess-and-predict:ci \
            .

      - name: Validate license secret
        env:
          FREESURFER_LICENSE: ${{ secrets.FREESURFER_LICENSE }}
        run: |
          if [ -z "$FREESURFER_LICENSE" ]; then
            echo "FREESURFER_LICENSE secret is required." >&2
            exit 1
          fi

      - name: GPU sanity check
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi
          else
            echo "nvidia-smi not found; no GPU visible in runner."
          fi

      - name: Install pandas
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y python3 python3-pip
          else
            apt-get update
            apt-get install -y python3 python3-pip
          fi
          python3 -m pip install --no-cache-dir pandas

      - name: Run container
        env:
          FREESURFER_LICENSE: ${{ secrets.FREESURFER_LICENSE }}
        run: |
          gpu_flags=""
          if command -v nvidia-smi >/dev/null 2>&1 || [ -e /dev/nvidiactl ]; then
            gpu_flags="--gpus all"
          fi
          CONTAINER=$(docker create \
            $gpu_flags \
            --env FREESURFER_LICENSE \
            pyment-preprocess-and-predict:ci \
            /bin/sh -c '
              mkdir -p /licenses /output/fastsurfer && \
              printf "%s" "$FREESURFER_LICENSE" > /licenses/freesurfer.txt && \
              /scripts/preprocess.sh \
                --license /licenses/freesurfer.txt \
                --python /envs/fastsurfer/bin/python \
                /input /output/fastsurfer && \
              /envs/pyment/bin/pyment-predict \
                /output/fastsurfer \
                -d /output/predictions.csv
            ')
          echo "CONTAINER=${CONTAINER}" >> "$GITHUB_ENV"
          docker cp "${{ github.workspace }}/.github/workflows/fixtures/ixi/raw/." "${CONTAINER}:/input/"
          docker start -a "${CONTAINER}"
          mkdir -p "${{ github.workspace }}/.act/ixi/outputs"
          docker cp "${CONTAINER}:/output/." "${{ github.workspace }}/.act/ixi/outputs/"

      - name: Compare predictions
        run: |
          python3 - <<'PY'
          import os
          import sys
          import numpy as np
          import pandas as pd

          gt = os.path.join(
            os.environ["GITHUB_WORKSPACE"],
            ".github/workflows/fixtures/ixi/predictions.csv"
          )
          pred = os.path.join(
            os.environ["GITHUB_WORKSPACE"],
            ".act/ixi/outputs/predictions.csv"
          )
          key = "source"

          gt = pd.read_csv(gt)
          gt[key] = gt[key].apply(lambda x: x.split('/')[-1])
          pred = pd.read_csv(pred)
          pred[key] = pred[key].apply(lambda x: x.split('/')[-1])

          if key not in gt.columns or key not in pred.columns:
            print(
              f"Missing key column '{key}' in one or both files.",
              file=sys.stderr
            )
            print(f"Ground truth columns: {list(gt.columns)}", file=sys.stderr)
            print(f"Prediction columns: {list(pred.columns)}", file=sys.stderr)
            sys.exit(1)

          columns = [
            'age', 'sex', 'handedness', 'bmi', 'fluid_intelligence',
            'neuroticism'
          ]

          df = pd.merge(gt, pred, how='inner', on=key, suffixes=['_gt', '_pred'])

          if not len(df) == len(gt):
            print(
              "Non-overlapping samples between new predictions and ground "
              "truths"
            )
            sys.exit(1)

          for col in columns:
            if not np.allclose(df[f'{col}_gt'], df[f'{col}_pred'], atol=1e-3):
              mean_difference = np.mean(
                np.abs(df[f'{col}_gt'] - df[f'{col}_pred'])
              )
              print(
                f'Column {col} differs between new predictions and ground '
                f'truths. Mean difference: {mean_difference}'
              )
              sys.exit(1)
          PY

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "${CONTAINER}" 2>/dev/null || true

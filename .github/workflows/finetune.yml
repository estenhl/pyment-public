name: Verify finetune Docker container

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  finetune:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Download weights
        run: |
          pip install .
          python scripts/download_weights.py --identifiers multi-2025 --destination checkpoints/pyment

      - name: Install Docker CLI
        run: |
          if ! command -v docker >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y docker.io
            else
              apt-get update
              apt-get install -y docker.io
            fi
          fi

      - name: Build finetune image
        run: |
          docker build \
            -f docker/finetune.Dockerfile \
            -t pyment-finetune:ci \
            .

      - name: Validate license secret
        env:
          FREESURFER_LICENSE: ${{ secrets.FREESURFER_LICENSE }}
        run: |
          if [ -z "$FREESURFER_LICENSE" ]; then
            echo "FREESURFER_LICENSE secret is required." >&2
            exit 1
          fi

      - name: GPU sanity check
        run: |
          if command -v nvidia-smi >/dev/null 2>&1; then
            nvidia-smi
          else
            echo "nvidia-smi not found; no GPU visible in runner."
          fi

      - name: Run container
        env:
          FREESURFER_LICENSE: ${{ secrets.FREESURFER_LICENSE }}
        run: |
          gpu_flags=""
          if command -v nvidia-smi >/dev/null 2>&1 || [ -e /dev/nvidiactl ]; then
            gpu_flags="--gpus all"
          fi
          CONTAINER=$(docker create \
            $gpu_flags \
            --env FREESURFER_LICENSE \
            pyment-finetune:ci \
            /bin/sh -c '
              mkdir -p /licenses /output/fastsurfer && \
              printf "%s" "$FREESURFER_LICENSE" > /licenses/freesurfer.txt && \
              /scripts/preprocess.sh \
                --license /licenses/freesurfer.txt \
                --python /envs/fastsurfer/bin/python \
                /input /output/fastsurfer && \
              pyment-finetune \
                /configuration.json
            ')
          echo "CONTAINER=${CONTAINER}" >> "$GITHUB_ENV"
          docker cp "${{ github.workspace }}/.github/workflows/fixtures/ds000030/raw/." "${CONTAINER}:/input/"
          docker cp "${{ github.workspace }}/.github/workflows/fixtures/ds000030/labels.csv" "${CONTAINER}:/labels.csv"
          docker cp "${{ github.workspace }}/.github/workflows/fixtures/finetune_binary.json" "${CONTAINER}:/configuration.json"
          docker start -a "${CONTAINER}"
          mkdir -p "${{ github.workspace }}/.act/ds000030/finetune_outputs"
          docker cp "${CONTAINER}:/output/." "${{ github.workspace }}/.act/ds000030/finetune_outputs/"

      - name: Verify output files
        run: |
          output_dir="${{ github.workspace }}/.act/ds000030/finetune_outputs/finetune_output"
          for f in \
            "$output_dir/model.keras" \
            "$output_dir/history.json" \
            "$output_dir/predictions.csv"; do
            if [ ! -f "$f" ]; then
              echo "Missing expected output file: $f" >&2
              exit 1
            fi
            echo "Found: $f"
          done

      - name: Cleanup
        if: always()
        run: |
          docker rm -f "${CONTAINER}" 2>/dev/null || true
